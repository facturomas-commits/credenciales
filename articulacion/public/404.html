<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No encontramos esa página · Articulación 2026</title>
  <meta name="theme-color" content="#070a22">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 600px at 10% 0%, rgba(255, 62, 165, .22), transparent 60%),
        radial-gradient(900px 600px at 90% 10%, rgba(34, 211, 238, .18), transparent 60%),
        #070a22;
      color: #f6f7ff;
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    .box { max-width: 560px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 22px;
      border-radius: 20px;
      background: linear-gradient(120deg, #ff3ea5, #6d5efc 55%, #22d3ee);
      display: grid; place-items: center;
      font-size: 28px; font-weight: 800; color: #0a0722;
      box-shadow: 0 20px 50px -18px rgba(255, 62, 165, .7);
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 10px; letter-spacing: -.02em; }
    p { color: #a9b0d6; line-height: 1.6; margin: 0 0 26px; }
    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      background: linear-gradient(100deg, #ff3ea5, #c026d3 30%, #6d5efc 65%, #22d3ee);
      color: #140724;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 16px 40px -16px rgba(255, 62, 165, .8);
    }
    a:hover { filter: brightness(1.07); }
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">626</div>
    <h1>Esa hoja no existe</h1>
    <p>La página que buscás no forma parte de la presentación.<br>Volvé a la portada para seguir hojeando.</p>
    <a href="/">Ir a la presentación</a>
  </main>
</body>
</html>
