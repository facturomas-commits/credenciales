# Articulación 2026 → http://127.0.0.1:3032
# Copiar a /etc/nginx/sites-available/articulacion2026.conf
# sudo ln -s /etc/nginx/sites-available/articulacion2026.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Luego: sudo certbot --nginx -d articulacion2026.ceka.com.ar

server {
    listen 80;
    listen [::]:80;
    server_name articulacion2026.ceka.com.ar;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
