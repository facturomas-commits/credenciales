<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credenciales - TEADEM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
body{background:#f1f5f9;font-family:system-ui,sans-serif}
.header{background:linear-gradient(135deg,#0f3460,#1a1a2e);color:#fff;padding:14px 24px}
.card{border:none;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.08);margin-bottom:16px}
.photo{width:110px;height:135px;object-fit:cover;border-radius:10px;border:2px solid #e2e8f0}
.badge-status{font-size:0.8rem}
.btn-step{width:100%;margin-bottom:8px}
#pcv{background:#111;border-radius:8px;cursor:grab;touch-action:none;display:block;margin:0 auto}
#pcv.dragging{cursor:grabbing}
.photo-editor-wrap{position:relative;display:inline-block}
.photo-tools .btn{margin:2px}
#printTray{display:none}
@media print{
  body *{visibility:hidden !important}
  #printTray,#printTray *{visibility:visible !important}
  #printTray{display:block !important;position:absolute;left:0;top:0;width:120mm;height:240mm}
}
</style>
</head>
<body>
<div class="header d-flex justify-content-between align-items-center">
  <h5 class="m-0"><i class="bi bi-card-heading"></i> Credenciales TEADEM</h5>
  <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Salir</button>
</div>

<div class="container py-4">

  <!-- Login -->
  <div id="loginBox">
    <div class="card p-4 mx-auto" style="max-width:380px">
      <h5 class="mb-3">Iniciar Sesi&oacute;n</h5>
      <input class="form-control mb-2" id="email" placeholder="Email">
      <input class="form-control mb-2" id="pass" type="password" placeholder="Password" onkeyup="if(event.key==='Enter')login()">
      <button class="btn btn-primary w-100" onclick="login()">Ingresar</button>
      <div id="loginErr" class="text-danger mt-2 small"></div>
    </div>
  </div>

  <!-- Main -->
  <div id="mainBox" style="display:none">
    <div class="row g-3 justify-content-center"><div class="col-lg-10">
      <div class="card p-3">
        <div class="input-group input-group-sm mb-1">
          <input class="form-control" id="dniInp" placeholder="DNI..." onkeyup="if(event.key==='Enter')buscar()">
          <button class="btn btn-primary" onclick="buscar()" title="Buscar"><i class="bi bi-search"></i></button>
        </div>
        <div class="input-group input-group-sm mb-1">
          <input class="form-control" id="apeInp" placeholder="Apellido..." onkeyup="if(event.key==='Enter')buscarApellido()">
          <button class="btn btn-outline-secondary" onclick="buscarApellido()" title="Buscar apellido"><i class="bi bi-search"></i></button>
        </div>
        <div id="apellidoResult" class="mb-2"></div>
        <div class="row g-3">
          <div class="col-md-7">
            <div id="personaData"></div>
            <div id="estadoData" class="mt-2"></div>
            <div id="botonesData" class="mt-3"></div>
          </div>
          <div class="col-md-5">
            <div id="previewBox" class="text-center" style="display:none"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-10" id="listaCard">
      <div class="card p-3">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
          <h6 class="mb-0 me-2"><i class="bi bi-list-ul"></i> Credenciales</h6>
          <input type="text" id="listaBuscar" class="form-control form-control-sm" style="max-width:180px" placeholder="Buscar DNI o nombre..." oninput="filtrarLista(this.value)">
          <label class="small text-muted mb-0">Desde</label>
          <input type="date" id="fechaDesde" class="form-control form-control-sm" style="max-width:150px" onchange="cargarLista()">
          <label class="small text-muted mb-0">Hasta</label>
          <input type="date" id="fechaHasta" class="form-control form-control-sm" style="max-width:150px" onchange="cargarLista()">
          <button class="btn btn-outline-secondary btn-sm" onclick="cargarLista()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="listaTodas()">Ver todas</button>
          <button class="btn btn-outline-danger btn-sm" onclick="descargarReporte()"><i class="bi bi-file-earmark-pdf"></i> Reporte PDF</button>
          <button class="btn btn-outline-danger btn-sm" onclick="vistaPreviaReporte()"><i class="bi bi-eye"></i> Ver Reporte</button>
          <button class="btn btn-outline-primary btn-sm" onclick="abrirRecibo()"><i class="bi bi-receipt"></i> Recibo</button>
          <button class="btn btn-outline-primary btn-sm" onclick="abrirRecibosLista()"><i class="bi bi-receipt-cutoff"></i> Recibos</button>
          <button class="btn btn-dark btn-sm" onclick="imprimirCredencial()"><i class="bi bi-printer"></i> Imprimir</button>
          <button class="btn btn-success btn-sm" onclick="nuevaPersona()"><i class="bi bi-plus-lg"></i> Nueva</button>
          <span class="ms-auto small text-muted" id="listaInfo"></span>
        </div>
        <div id="listaData"></div>
      </div>
    </div>
    </div>
  </div>
</div>

<!-- Modal Editar Datos -->

          <div class="col-md-4"><label class="form-label small mb-0">F. Bautismo</label><input type="date" class="form-control form-control-sm" id="e_fecha_bautismo"></div>
          <div class="col-md-4"><label class="form-label small mb-0">Ministerio</label><select class="form-select form-select-sm" id="e_ministerio"><option value="">--</option></select></div>

          <div class="col-md-4"><label class="form-label small mb-0">Vencimiento</label><input type="date" class="form-control form-control-sm" id="e_fecha_vencimiento"></div>
          <div class="col-md-4"><label class="form-label small mb-0">De baja</label><div class="form-check form-switch mt-1"><input class="form-check-input" type="checkbox" id="e_baja"><label class="form-check-label small" for="e_baja">Baja</label></div></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="guardarDatos()"><i class="bi bi-check-lg"></i> Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Foto -->
<div class="modal fade" id="fotoModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title"><i class="bi bi-camera"></i> Editar Foto</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>

            <canvas id="pcv" width="360" height="480"></canvas>

          <div class="photo-tools mt-2">

            <button class="btn btn-outline-secondary btn-sm" onclick="pPegar()" title="Pegar del portapapeles (Ctrl+V)"><i class="bi bi-clipboard"></i> Pegar</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="pAnterior()" title="Traer de credencial anterior"><i class="bi bi-image"></i> Anterior</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="pFit()"><i class="bi bi-arrows-fullscreen"></i> Ajustar</button>

<script>
var TOKEN="",API=origin,cur=null,modoConsulta=false,previewImgSrc="",previewDni="";
function q(s){return document.getElementById(s)}
function api(p,o){
  o=o||{};o.headers=o.headers||{};
  if(TOKEN)o.headers.Authorization="Bearer "+TOKEN;
  return fetch(API+p,o).then(function(r){
    if(r.status===401){logout();throw new Error("Sesion expirada");}
    var ct=r.headers.get("content-type")||"";
    if(r.ok){return ct.indexOf("application/json")>=0?r.json():r.text();}
    return r.text().then(function(t){
      var msg=t;
      try{var j=JSON.parse(t);if(j&&j.error)msg=j.error;}catch(e){}
      throw new Error(msg);
    });
  });
}
function login(){
  var e=q("email").value.trim(),p=q("pass").value.trim();
  fetch(API+"/usuarios/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})})
  .then(function(r){return r.json()})
  .then(function(d){if(d.token){TOKEN=d.token;modoConsulta=d.nivel_maximo>=10;q("loginBox").style.display="none";q("mainBox").style.display="block";cargarProvincias();if(!modoConsulta)cargarLista();if(modoConsulta)q("listaCard").style.display="none";}else{q("loginErr").textContent=d.error||"Error";}})
  .catch(function(e){q("loginErr").textContent=e.message;});
}
function logout(){TOKEN="";cur=null;q("loginBox").style.display="block";q("mainBox").style.display="none";}

function cargarProvincias(){
  api("/provincias").then(function(list){
    var h="<option value=''>--</option>";
    if(list&&list.length)list.forEach(function(d){h+="<option value='"+d.id_provincia+"'>"+d.nombre+"</option>";});
    q("e_id_provincia").innerHTML=h;
  }).catch(function(){});
}

var EC=[{id:1,n:"Soltero"},{id:2,n:"Casado"},{id:3,n:"Casada"},{id:4,n:"Viudo"},{id:5,n:"Viuda"},{id:6,n:"Soltera"}];
  var MIN=["Pastor Presidente","Pastor","Evangelista","Anciano","Di\u00e1cono","Diaconisa","Colaborador","Misionero","Misionera"];
function llenarCombos(){
  var h="<option value=''>--</option>";
  EC.forEach(function(e){h+="<option value='"+e.id+"'>"+e.n+"</option>";});
  q("e_id_estado_civil").innerHTML=h;
  h="<option value=''>--</option>";
  MIN.forEach(function(m){h+="<option value='"+m+"'>"+m+"</option>";});
  q("e_ministerio").innerHTML=h;
}

function setSelectValor(id, valor){
  if(valor===undefined||valor===null)valor="";
  var sel=q(id);
  var v=String(valor);
  var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");};
  var target=norm(v);
  var found=null;
  for(var i=0;i<sel.options.length;i++){
    if(norm(sel.options[i].value)===target){found=sel.options[i].value;break;}
  }
  if(found!==null){
    sel.value=found;
  }else if(v!==""){
    var o=document.createElement("option");
    o.value=v;o.text=v;o.selected=true;
    sel.appendChild(o);
    sel.value=v;
  }else{
    sel.value="";
  }
}

function buscar(){
  var dni=q("dniInp").value.trim();if(!dni)return;
  q("personaData").innerHTML="<div class='text-muted small'>Buscando...</div>";
  q("apellidoResult").innerHTML="";
  api("/personas/dni/"+dni).then(function(p){
    cur=p;mostrarPersona(p);mostrarEstado(dni);
  }).catch(function(e){
    cur=null;
    q("estadoData").innerHTML="";q("botonesData").innerHTML="";q("previewBox").style.display="none";
    buscarArchivosAnterior(dni);
  });
}

function buscarArchivosAnterior(termino){
  q("personaData").innerHTML="<div class='text-muted small'><i class='bi bi-search'></i> Buscando en archivos anteriores por \""+termino+"\"...</div>";
  api("/personas/archivos-anterior/"+encodeURIComponent(termino)).then(function(list){
    if(!list||!list.length){
      q("personaData").innerHTML="<div class='text-danger small'>No hay archivo anterior con ese DNI.</div>"+
        "<div class='mt-2 small'>Prob&aacute; buscar por apellido:</div>"+
        "<div class='input-group input-group-sm mt-1' style='max-width:320px'>"+
        "<input class='form-control' id='apeIaInp' placeholder='Apellido...' onkeyup='if(event.key===\"Enter\")buscarIAporApellido()'>"+
        "<button class='btn btn-outline-primary' onclick='buscarIAporApellido()'><i class='bi bi-search'></i></button></div>";
      return;
    }
    mostrarListaArchivos(list);
  }).catch(function(e){
    q("personaData").innerHTML="<div class='text-danger small'>"+e.message+"</div>";
  });
}

function buscarIAporApellido(){

function ecId(nombre){
  if(!nombre)return 0;
  var n=nombre.toLowerCase().trim();
  if(n.indexOf("casada")>=0)return 3;
  if(n.indexOf("casado")>=0)return 2;
  if(n.indexOf("viuda")>=0)return 5;
  if(n.indexOf("viudo")>=0)return 4;
  if(n.indexOf("soltera")>=0)return 6;
  if(n.indexOf("soltero")>=0)return 1;
  return 0;
}

function cargarImpresorasLocal(){
  return fetch("http://127.0.0.1:9876/printers")
    .then(function(r){if(!r.ok)throw new Error("Agente respondió "+r.status);return r.json();})
    .then(function(data){
      var lista = (data && data.printers && data.printers.length) ? data.printers
                : (Array.isArray(data) ? data : []);
      var s=q("imp_printer"),h="";
      if(lista.length){
        lista.forEach(function(p){
          var nom = p.name || p.nombre || "";
          var esEpson = nom.toLowerCase().indexOf("epson")>=0;
          h+="<option value='"+nom.replace(/'/g,"&#39;")+"'"+((esEpson&&!h.includes('selected'))?" selected":"")+">"+nom+"</option>";
        });
        s.innerHTML=h;
        return true;
      }
      throw new Error("El agente no devolvió impresoras");
    });

function generarRecibo(){
  var iglesia=q("r_iglesia").value.trim();
  var cantidad=q("r_cantidad").value.trim();
  var importe=q("r_importe").value.trim();
  var fecha=q("r_fecha").value;
  if(!iglesia){alert("Ingrese el nombre de la iglesia");return;}
  if(!cantidad){alert("Ingrese la cantidad");return;}
  if(!importe){alert("Ingrese el importe");return;}
  api("/credenciales/recibo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({iglesia:iglesia,cantidad:cantidad,importe:importe,fecha:fecha})})
  .then(function(d){
    if(d.error){alert(d.error);return;}
    var b64=d.pdf_base64.split(",")[1]||d.pdf_base64;
    var bin=atob(b64);var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var blob=new Blob([arr],{type:"application/pdf"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="recibo_"+(d.numero||"")+".pdf";
    a.click();
    bootstrap.Modal.getInstance(q("reciboModal")).hide();
  })
  .catch(function(e){alert(e.message);});
}

// ---------- Lista de credenciales ----------
function cargarLista(){
  var desde=q("fechaDesde").value, hasta=q("fechaHasta").value;
  var url="/credenciales/lista";
  var ps=[];
  if(desde)ps.push("fecha_desde="+encodeURIComponent(desde));
  if(hasta)ps.push("fecha_hasta="+encodeURIComponent(hasta));
  if(ps.length)url+="?"+ps.join("&");
  api(url).then(function(list){
    if(!list||!list.length){q("listaData").innerHTML="<div class='text-muted small'>Sin credenciales para esta fecha</div>";q("listaInfo").textContent="";return;}
    q("listaInfo").textContent=list.length+" credencial(es)";
    var h="<div class='table-responsive'><table class='table table-sm align-middle mb-0'><thead><tr><th>Foto</th><th>Fecha</th><th>DNI</th><th>Nombre</th><th class='text-center'>Impresa</th><th class='text-center'>Entregada</th><th class='text-center'>Pagada</th><th class='text-center'>Sin Cargo</th><th class='text-center'>Baja</th><th>Vence</th></tr></thead><tbody>";
    list.forEach(function(c){
      var foto = c.foto_base64
        ? "<img src='"+c.foto_base64+"' style='width:38px;height:48px;object-fit:cover;border-radius:4px;border:1px solid #ccc'>"
        : "<div style='width:38px;height:48px;border-radius:4px;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;color:#bbb'><i class='bi bi-person'></i></div>";
      h+="<tr><td>"+foto+"</td><td class='small'>"+fmtFecha(c.fecha)+"</td><td class='small' style='cursor:pointer' title='Doble clic para abrir' ondblclick=\"elegirPersona('"+c.dni+"')\">"+c.dni+"</td><td>"+((c.apellido||"")+" "+(c.nombre||"")).trim()+"</td>"+
         "<td class='text-center'>"+chk(c.id,"impreso",c.impreso)+"</td>"+
         "<td class='text-center'>"+chk(c.id,"entregado",c.entregado)+"</td>"+
         "<td class='text-center'>"+chk(c.id,"pagado",c.pagado)+"</td>"+
         "<td class='text-center'>"+chk(c.id,"sin_cargo",c.sin_cargo)+"</td>"+
         "<td class='text-center'>"+chk(c.id,"baja",c.baja)+"</td>"+
         "<td><input type='date' class='form-control form-control-sm' style='width:145px' value='"+(c.fecha_vencimiento||"")+"' onchange=\"setVencimiento("+c.id+",this.value)\"></td></tr>";
    });
    h+="</tbody></table></div>";
    q("listaData").innerHTML=h;
  }).catch(function(e){q("listaData").innerHTML="<div class='text-danger small'>"+e.message+"</div>";});
}
function chk(id,campo,val){
  return "<input type='checkbox' class='form-check-input' "+(val==="S"?"checked":"")+" onchange=\"setRegistro("+id+",'"+campo+"',this.checked)\">";
}
function setRegistro(id,campo,val){
  var body={};body[campo]=val?"S":"N";
  api("/credenciales/registro/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(){cargarLista();})
  .catch(function(e){alert(e.message);cargarLista();});
}
function setVencimiento(id,val){
  api("/credenciales/registro/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({fecha_vencimiento: val||""})})
  .then(function(){cargarLista();})
  .catch(function(e){alert(e.message);cargarLista();});
}
function listaTodas(){q("fechaDesde").value="";q("fechaHasta").value="";cargarLista();}
function filtrarLista(v){
  v=v.toLowerCase();
  document.querySelectorAll("#listaData tbody tr").forEach(function(tr){
    tr.style.display = tr.textContent.toLowerCase().indexOf(v)>=0 ? "" : "none";
  });
}
function fmtFecha(s){
  if(!s)return "-";
  return s.replace("T"," ").substring(0,16);
}
function descargarReporte(){
  var desde=q("fechaDesde").value, hasta=q("fechaHasta").value;
  var url="/credenciales/reporte";
  var ps=[];
  if(desde)ps.push("fecha_desde="+encodeURIComponent(desde));
  if(hasta)ps.push("fecha_hasta="+encodeURIComponent(hasta));
  if(ps.length)url+="?"+ps.join("&");
  fetch(API+url,{headers:{"Authorization":"Bearer "+TOKEN}})
  .then(function(r){if(!r.ok)throw new Error("Error generando reporte");return r.json();})
  .then(function(d){
    if(d.error){alert(d.error);return;}
    if(!d.pdf_base64){alert("Sin datos");return;}
    var b64=d.pdf_base64.split(",")[1]||d.pdf_base64;
    var bin=atob(b64);
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var blob=new Blob([arr],{type:"application/pdf"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="reporte_credenciales"+(desde||hasta?("_"+desde+"_a_"+hasta):"")+".pdf";
    a.click();
  })
  .catch(function(e){alert(e.message);});
}

// ---------- Editor de foto ----------
var psrc=null,pscale=1,pox=0,poy=0,pdrag=false,plx=0,ply=0,pdni=null;
var GUIDEX=30,GUIDEY=50,GUIDEW=300,GUIDEH=380; // ratio 300:380 (retrato)
function pctx(){return q("pcv").getContext("2d");}
function abrirFoto(){
  if(!cur)return;
  pdni=cur.dni;
  psrc=null;pdraw();
  if(cur.foto_base64){
    var img=new Image();
    img.onload=function(){setSrc(img);};
    img.onerror=function(){toast("No se pudo cargar la foto");};
    img.src=cur.foto_base64;
  }
  new bootstrap.Modal(q("fotoModal")).show();
}
function setSrc(img){
  var c=document.createElement("canvas");
  c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
  c.getContext("2d").drawImage(img,0,0);
  psrc=c;pFit();
}
function pCargar(){
  q("fileInp").onchange=function(){
    var f=this.files[0];if(!f)return;
    cargarImgFile(f);
    this.value="";
  };
  q("fileInp").click();
}
function cargarImgFile(f){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){setSrc(img);};img.src=fr.result;};
  fr.readAsDataURL(f);
}
function pAnterior(){
  if(!pdni){alert("No hay DNI");return;}
  api("/credenciales/imagen-anterior/"+pdni).then(function(r){
    if(r.imagen_base64){
      var img=new Image();
      img.onload=function(){setSrc(img);};
      img.src=r.imagen_base64;
    } else {
      alert("No hay credencial anterior para este DNI");
    }
  }).catch(function(e){alert(e.message);});
}
function pPegar(){
  if(navigator.clipboard && navigator.clipboard.read){
    navigator.clipboard.read().then(function(items){
      for(var i=0;i<items.length;i++){
        var t=items[i].getType?items[i].types:null;
        if(items[i].types && items[i].types.indexOf("image/png")>=0){
          items[i].getType("image/png").then(function(blob){cargarImgFile(blob);});
          return;
        }
        if(items[i].types && items[i].types.indexOf("image/jpeg")>=0){
          items[i].getType("image/jpeg").then(function(blob){cargarImgFile(blob);});
          return;
        }
      }
      alert("El portapapeles no tiene una imagen");
    }).catch(function(){alert("No se pudo leer el portapapeles. Usá Ctrl+V");});
  } else {
    alert("Presioná Ctrl+V para pegar la imagen");
  }
}
document.addEventListener("paste",function(e){
  var fotoModal = document.getElementById("fotoModal");
  if(!fotoModal || !fotoModal.classList.contains("show")) return;
  var items=(e.clipboardData||{}).items;
  if(!items) return;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf("image")===0){
      var f=items[i].getAsFile();
      if(f){ cargarImgFile(f); }
      e.preventDefault();
      break;
    }
  }
});
function pFit(){
  if(!psrc)return;
  pscale=Math.max(GUIDEW/psrc.width,GUIDEH/psrc.height);
  pox=GUIDEX+(GUIDEW-psrc.width*pscale)/2;
  poy=GUIDEY+(GUIDEH-psrc.height*pscale)/2;
  pdraw();
}
function pZoom(f){
  if(!psrc)return;
  var cx=GUIDEX+GUIDEW/2,cy=GUIDEY+GUIDEH/2;
  var ns=pscale*f;ns=Math.max(0.05,Math.min(ns,8));
  pox=cx-(cx-pox)*(ns/pscale);poy=cy-(cy-poy)*(ns/pscale);
  pscale=ns;pdraw();
}
function pRotar(dir){
  if(!psrc)return;
  var c=document.createElement("canvas");
  c.width=psrc.height;c.height=psrc.width;
  var x=c.getContext("2d");
  x.translate(c.width/2,c.height/2);
  x.rotate(dir*Math.PI/2);
  x.drawImage(psrc,-psrc.width/2,-psrc.height/2);
  psrc=c;pFit();
}
function pVoltear(axis){
  if(!psrc)return;
  var c=document.createElement("canvas");
  c.width=psrc.width;c.height=psrc.height;
  var x=c.getContext("2d");
  if(axis==="h"){
    x.translate(c.width,0);
    x.scale(-1,1);
  } else {
    x.translate(0,c.height);
    x.scale(1,-1);
  }
  x.drawImage(psrc,0,0);
  psrc=c;pFit();
}
function pdraw(){
  var cv=q("pcv"),x=pctx();
  x.fillStyle="#111";x.fillRect(0,0,cv.width,cv.height);
  if(psrc){
    x.drawImage(psrc,pox,poy,psrc.width*pscale,psrc.height*pscale);
  }else{
    x.fillStyle="#666";x.font="14px system-ui";x.textAlign="center";
    x.fillText("Sin foto - Importa una imagen",cv.width/2,cv.height/2);
  }
  // oscurecer fuera del recuadro
  x.fillStyle="rgba(0,0,0,0.45)";
  x.fillRect(0,0,cv.width,GUIDEY);
  x.fillRect(0,GUIDEY+GUIDEH,cv.width,cv.height-(GUIDEY+GUIDEH));
  x.fillRect(0,GUIDEY,GUIDEX,GUIDEH);
  x.fillRect(GUIDEX+GUIDEW,GUIDEY,cv.width-(GUIDEX+GUIDEW),GUIDEH);
  // recuadro
  x.strokeStyle="#fff";x.lineWidth=2;
  x.strokeRect(GUIDEX,GUIDEY,GUIDEW,GUIDEH);
}
function pGuardar(){
  if(!psrc){toast("No hay imagen");return;}
  var sx=(GUIDEX-pox)/pscale, sy=(GUIDEY-poy)/pscale;
  var sw=GUIDEW/pscale, sh=GUIDEH/pscale;
  sx=Math.max(0,sx);sy=Math.max(0,sy);
  sw=Math.min(psrc.width-sx,sw);sh=Math.min(psrc.height-sy,sh);
  if(sw<=0||sh<=0){toast("Ajusta la imagen dentro del recuadro");return;}
  var out=document.createElement("canvas");
  out.width=600;out.height=760;
  var x=out.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,600,760);
  x.drawImage(psrc,sx,sy,sw,sh,0,0,600,760);
  var data=out.toDataURL("image/jpeg",0.92);
  api("/credenciales/foto/"+pdni,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imagen_base64:data})})
  .then(function(r){if(r.error){alert(r.error);return;}
    bootstrap.Modal.getInstance(q("fotoModal")).hide();toast("Foto guardada");buscar();})
  .catch(function(e){alert(e.message);});
}
function toast(m){alert(m);}

// eventos canvas
(function(){
  var cv=q("pcv");
  function pos(e){
    var r=cv.getBoundingClientRect();
    var cx=(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX)-r.left;
    var cy=(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY)-r.top;
    cx=cx*(cv.width/r.width);cy=cy*(cv.height/r.height);
    return {x:cx,y:cy};
  }
  cv.addEventListener("mousedown",function(e){pdrag=true;var p=pos(e);plx=p.x;ply=p.y;cv.classList.add("dragging");});
  window.addEventListener("mousemove",function(e){if(!pdrag||!psrc)return;var p=pos(e);pox+=p.x-plx;poy+=p.y-ply;plx=p.x;ply=p.y;pdraw();});
  window.addEventListener("mouseup",function(){pdrag=false;cv.classList.remove("dragging");});
  cv.addEventListener("wheel",function(e){e.preventDefault();if(!psrc)return;var p=pos(e);var ns=pscale*(e.deltaY<0?1.15:0.87);ns=Math.max(0.05,Math.min(ns,8));pox=p.x-(p.x-pox)*(ns/pscale);poy=p.y-(p.y-poy)*(ns/pscale);pscale=ns;pdraw();},{passive:false});
  cv.addEventListener("touchstart",function(e){e.preventDefault();pdrag=true;var p=pos(e);plx=p.x;ply=p.y;},{passive:false});
  cv.addEventListener("touchmove",function(e){e.preventDefault();if(!pdrag||!psrc)return;var p=pos(e);pox+=p.x-plx;poy+=p.y-ply;plx=p.x;ply=p.y;pdraw();},{passive:false});
  cv.addEventListener("touchend",function(){pdrag=false;});
})();
